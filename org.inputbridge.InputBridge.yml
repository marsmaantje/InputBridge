app-id: org.inputbridge.InputBridge
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: InputBridge
finish-args:
    - --socket=x11
    - --socket=wayland
    - --device=all
    - --share=network
    - --share=ipc
modules:
    # SDL3 is not part of the freedesktop runtime so it must be bundled.
    # We build it from the same submodule the rest of the project uses
    # (checked out by actions/checkout with submodules: recursive).
    - name: SDL3
      buildsystem: cmake-ninja
      builddir: true
      config-opts:
          - -DCMAKE_BUILD_TYPE=Release
          - -DSDL_SHARED=ON
          - -DSDL_STATIC=OFF
          - -DSDL_TEST_LIBRARY=OFF
          - -DSDL_TESTS=OFF
      sources:
          - type: dir
            path: lib/sdl

    - name: InputBridge
      buildsystem: cmake-ninja
      builddir: true
      config-opts:
          - -DCMAKE_BUILD_TYPE=Release
          - -DENABLE_WEBSOCKETS=ON
          - -DSDL_SHARED=ON
          - -DSDL_STATIC=OFF
      sources:
          - type: dir
            path: .
          - type: git
            url: https://github.com/uNetworking/uSockets.git
            tag: v0.8.8
            dest: lib/uSockets_download
          - type: git
            url: https://github.com/uNetworking/uWebSockets.git
            tag: v20.67.0
            dest: lib/uWebSockets_download
