app-id: org.inputbridge.InputBridge
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: InputBridge
finish-args:
    - --socket=x11
    - --socket=wayland
    - --device=all
    - --share=network
    - --share=ipc
    # Wiimote/Balance Board udev permission rule support (see
    # packaging/linux/README.md and Devices/Wiimote/Linux/*):
    # - Bind-mounts the HOST's real /etc/udev/rules.d through at the same
    #   path, instead of the sandbox's own private copy, so
    #   WiimoteLinuxDiagnostics's "Check for common issues" can actually see
    #   a rule installed from outside the sandbox (or one installed via the
    #   flatpak-spawn path below), and so a rule installed from in here
    #   lands somewhere the host's udevd will actually read. ":create" lets
    #   the in-app installer create the file if it isn't there yet.
    - --filesystem=/etc/udev/rules.d:create
    # - pkexec can't reach the host's PolicyKit authority from inside the
    #   sandbox, so the in-app installer shells out via `flatpak-spawn
    #   --host pkexec ...` instead (see LinuxUdevInstaller::RunScript).
    #   That requires talk access to the Flatpak session-bus service.
    - --talk-name=org.freedesktop.Flatpak
modules:
    - name: InputBridge
      buildsystem: cmake-ninja
      builddir: true
      config-opts:
          - -DCMAKE_BUILD_TYPE=Release
          - -DENABLE_WEBSOCKETS=ON
          - -DSDL_SHARED=OFF
          - -DSDL_STATIC=ON
      sources:
          - type: dir
            path: .
          - type: git
            url: https://github.com/uNetworking/uSockets.git
            tag: v0.8.8
            dest: lib/uSockets_download
          - type: git
            url: https://github.com/uNetworking/uWebSockets.git
            tag: v20.67.0
            dest: lib/uWebSockets_download