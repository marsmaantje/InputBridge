name: Build and Package

on:
    push:
        tags:
            - "v*"   # fires on v1.0.0, v1.2.3-beta, etc.

    workflow_dispatch:
        inputs:
            build_target:
                description: "Select build target"
                required: true
                type: choice
                default: "all"
                options:
                    - all
                    - windows
                    - macos
                    - ubuntu
                    - ubuntu-appimage
                    - ubuntu-flatpak
                    - fedora
                    - arch
            run_tests:
                description: "Run Google Tests"
                required: true
                type: choice
                default: "no"
                options:
                    - "no"
                    - "yes"
                    - "only"

permissions:
  checks: write    # for dorny/test-reporter to publish test reports
  contents: write  # for actions/checkout to fetch code, and to create GitHub Releases

jobs:
    build-windows:
        if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'windows') && github.event.inputs.run_tests != 'only' }}
        runs-on: windows-2025
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive

            - name: Configure CMake
              run: cmake -B build -DCMAKE_BUILD_TYPE=Release

            - name: Build
              run: cmake --build build --config Release

            - name: Package
              run: |
                  cmake --install build --config Release --prefix package
                  copy "C:/Program Files/OpenSSL/bin/libcrypto-3-x64.dll" package/bin
                  copy "C:/Program Files/OpenSSL/bin/libssl-3-x64.dll" package/bin
                  cmake -E make_directory package/bin/licenses
                  if (Test-Path "C:/Program Files/OpenSSL/license.txt") { copy "C:/Program Files/OpenSSL/license.txt" package/bin/licenses/OPENSSL_LICENSE.txt }

            - name: Upload Artifact
              uses: actions/upload-artifact@v6
              with:
                  name: InputBridge-Windows
                  path: package/bin

    build-macos:
        if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'macos') && github.event.inputs.run_tests != 'only' }}
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive

            - name: Configure CMake
              run: cmake -B build -DCMAKE_BUILD_TYPE=Release

            - name: Build
              run: cmake --build build --config Release

            - name: Package
              run: |
                  cd build
                  cpack -C Release -G ZIP

            - name: Upload Artifact
              uses: actions/upload-artifact@v6
              with:
                  name: InputBridge-macOS
                  path: build/*.zip

    build-ubuntu-appimage:
      if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'ubuntu-appimage') && github.event.inputs.run_tests != 'only' }}
      runs-on: ubuntu-24.04

      steps:
          - uses: actions/checkout@v6
            with:
                submodules: recursive

          - name: Install Dependencies
            run: |
                sudo apt-get update
                sudo apt-get install -y \
                  build-essential git pkg-config cmake ninja-build \
                  libasound2-dev libpulse-dev libaudio-dev libjack-dev \
                  libsndio-dev libsamplerate0-dev libx11-dev libxext-dev \
                  libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
                  libxss-dev libxkbcommon-dev libxinerama-dev \
                  libxxf86vm-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
                  libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
                  libibus-1.0-dev libudev-dev fcitx-libs-dev \
                  libpipewire-0.3-dev libwayland-dev libdecor-0-dev \
                  libxtst-dev libssl-dev zlib1g-dev libuv1-dev \
                  libusb-1.0-0-dev

          - name: Configure
            run: |
                cmake -B build \
                  -G Ninja \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_INSTALL_PREFIX=/usr \
                  -DSDL_SHARED=OFF \
                  -DSDL_STATIC=ON

          - name: Build
            run: cmake --build build

          - name: Install into AppDir
            run: |
                rm -rf build/AppDir
                mkdir -p build/AppDir

                DESTDIR=$PWD/build/AppDir cmake --install build

          - name: Verify AppDir Contents
            run: |
                find build/AppDir

                test -f build/AppDir/usr/bin/InputBridge

          - name: Create AppImage
            run: |
                wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

                chmod +x linuxdeploy-x86_64.AppImage

                export LD_LIBRARY_PATH=$PWD/build/AppDir/usr/lib:$LD_LIBRARY_PATH

                APPIMAGE_EXTRACT_AND_RUN=1 \
                STRIP=/bin/true \
                ./linuxdeploy-x86_64.AppImage \
                  --appdir build/AppDir \
                  --executable build/AppDir/usr/bin/InputBridge \
                  --icon-file build/org.inputbridge.InputBridge.svg \
                  --desktop-file build/org.inputbridge.InputBridge.desktop \
                  --output appimage

                mv InputBridge*.AppImage InputBridge-Ubuntu.AppImage

          - name: Upload Artifact
            uses: actions/upload-artifact@v6
            with:
                name: InputBridge-Ubuntu-AppImage
                path: InputBridge-Ubuntu.AppImage

    build-ubuntu-flatpak:
        if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'ubuntu-flatpak') && github.event.inputs.run_tests != 'only' }}
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive

            - name: Install Flatpak
              run: |
                  sudo apt-get update
                  sudo apt-get install -y flatpak flatpak-builder
                  flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
                  flatpak install --user -y org.freedesktop.Sdk//25.08 org.freedesktop.Platform//25.08

            - name: Build Flatpak
              run: |
                  flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --repo=repo --force-clean build-dir org.inputbridge.InputBridge.yml
                  flatpak build-bundle repo InputBridge-Ubuntu.flatpak org.inputbridge.InputBridge

            - name: Upload Artifact
              uses: actions/upload-artifact@v6
              with:
                  name: InputBridge-Ubuntu-Flatpak
                  path: InputBridge-Ubuntu.flatpak

    build-ubuntu:
        if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'ubuntu') && github.event.inputs.run_tests != 'only' }}
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive

            - name: Install Dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential git pkg-config cmake ninja-build libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libsamplerate0-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libxinerama-dev libxxf86vm-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev libxtst-dev libssl-dev zlib1g-dev libuv1-dev libusb-1.0-0-dev

            - name: Configure CMake
              run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON

            - name: Build
              run: cmake --build build --config Release

            - name: Package
              run: |
                  cmake --install build --config Release --prefix package
                  # Copy shared libs (e.g. liblo.so) from lib to bin so they are included in the tarball
                  if [ -d "package/lib" ]; then cp -P package/lib/* package/bin/ || true; fi
                  mkdir -p dist
                  tar -czvf dist/InputBridge-Ubuntu.tar.gz -C package/bin .

            - name: Upload Artifact
              uses: actions/upload-artifact@v6
              with:
                  name: InputBridge-Ubuntu
                  path: dist/InputBridge-Ubuntu.tar.gz

    build-fedora:
        if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'fedora') && github.event.inputs.run_tests != 'only' }}
        runs-on: ubuntu-24.04
        container: fedora:latest
        steps:
            - name: Install Dependencies
              run: dnf install -y git gcc-c++ make cmake libX11-devel libXrandr-devel libXcursor-devel libXi-devel mesa-libGL-devel libxkbcommon-devel wayland-devel systemd-devel alsa-lib-devel pulseaudio-libs-devel libXScrnSaver-devel libXext-devel libXfixes-devel libXinerama-devel libXxf86vm-devel dbus-devel libdrm-devel mesa-libgbm-devel libusb1-devel libsamplerate-devel libdecor-devel libXtst-devel openssl-devel zlib-devel libuv-devel

            - uses: actions/checkout@v6
              with: { submodules: recursive }

            - name: Configure CMake
              run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON

            - name: Build
              run: cmake --build build --config Release

            - name: Package
              run: |
                  cmake --install build --config Release --prefix package
                  # Copy shared libs (e.g. liblo.so) from lib to bin so they are included in the tarball
                  if [ -d "package/lib" ]; then cp -P package/lib/* package/bin/ || true; fi
                  mkdir -p dist
                  tar -czvf dist/InputBridge-Fedora.tar.gz -C package/bin .

            - name: Upload Artifact
              uses: actions/upload-artifact@v6
              with:
                  name: InputBridge-Fedora
                  path: dist/InputBridge-Fedora.tar.gz

    build-arch:
        if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'arch') && github.event.inputs.run_tests != 'only' }}
        runs-on: ubuntu-24.04
        container: archlinux:latest
        steps:
            - name: Install Dependencies
              run: pacman -Syu --noconfirm git base-devel cmake libx11 libxrandr libxcursor libxi mesa libxkbcommon wayland systemd-libs alsa-lib pulseaudio libxss libxext libxfixes libxinerama libxxf86vm dbus libdrm libusb libsamplerate libdecor libxtst openssl zlib libuv

            - uses: actions/checkout@v6
              with: { submodules: recursive }

            - name: Configure CMake
              run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON

            - name: Build
              run: cmake --build build --config Release

            - name: Package
              run: |
                  cmake --install build --config Release --prefix package
                  # Copy shared libs (e.g. liblo.so) from lib to bin so they are included in the tarball
                  if [ -d "package/lib" ]; then cp -P package/lib/* package/bin/ || true; fi
                  mkdir -p dist
                  tar -czvf dist/InputBridge-Arch.tar.gz -C package/bin .

            - name: Upload Artifact
              uses: actions/upload-artifact@v6
              with:
                  name: InputBridge-Arch
                  path: dist/InputBridge-Arch.tar.gz

    run-tests:
        if: ${{ github.event.inputs.run_tests == 'yes' || github.event.inputs.run_tests == 'only' }}
        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
              with: { submodules: recursive }

            - name: Cache apt packages
              if: runner.os == 'Linux'
              uses: actions/cache@v4
              with:
                path: |
                  /var/cache/apt/archives
                key: ${{ runner.os }}-apt-cache-${{ hashFiles('.github/workflows/build.yml') }}
                restore-keys: |
                  ${{ runner.os }}-apt-cache-

            - name: Install Dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential git pkg-config cmake ninja-build libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libsamplerate0-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libxinerama-dev libxxf86vm-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev libxtst-dev libssl-dev zlib1g-dev libuv1-dev libusb-1.0-0-dev lcov

            - name: Add OpenSSL to PATH (Windows)
              if: runner.os == 'Windows'
              run: echo "C:/Program Files/OpenSSL/bin" >> $env:GITHUB_PATH

            - name: Configure CMake
              shell: bash
              run: |
                declare -a CMAKE_ARGS=("-B" "build" "-G" "Ninja" "-DBUILD_TESTS=ON" "-DCMAKE_BUILD_TYPE=Debug")
                if [[ "${{ runner.os }}" == "Linux" ]]; then
                  CMAKE_ARGS+=("-DCMAKE_CXX_FLAGS=--coverage" "-DCMAKE_C_FLAGS=--coverage")
                fi
                cmake "${CMAKE_ARGS[@]}"

            - name: Build
              run: cmake --build build

            - name: Run Tests
              working-directory: ./build
              run: ctest --output-on-failure --output-junit test-results.xml

            - name: Upload Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-${{ matrix.os }}
                  path: build/test-results.xml

            - name: Publish Test Report
              uses: dorny/test-reporter@v1
              if: always()
              with:
                name: Test Results (${{ matrix.os }})
                path: build/test-results.xml
                reporter: java-junit

            - name: Generate Coverage Report
              if: runner.os == 'Linux'
              run: |
                  lcov --capture --ignore-errors mismatch --rc geninfo_unexecuted_blocks=1 --directory build --output-file coverage.info
                  lcov --remove coverage.info '/usr/*' '*/tests/*' '*/lib/*' --output-file coverage.info
                  genhtml coverage.info --output-directory coverage-report

            - name: Upload Coverage Report
              if: runner.os == 'Linux'
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage-report
    create-release:
        name: Create GitHub Release
        # Only run on tag pushes, not manual dispatches.
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        needs:
            - build-windows
            - build-macos
            - build-ubuntu
            - build-ubuntu-appimage
            - build-ubuntu-flatpak
            - build-fedora
            - build-arch
        runs-on: ubuntu-24.04
        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v6
              with:
                  path: artifacts

            # Flatten each artifact folder into a single zip for the release.
            - name: Repackage artifacts
              run: |
                  mkdir release-assets

                  # Windows — folder of files → zip
                  cd artifacts/InputBridge-Windows
                  zip -r ../../release-assets/InputBridge-Windows-${{ github.ref_name }}.zip .
                  cd ../..

                  # macOS — already a zip from cpack
                  cp artifacts/InputBridge-macOS/*.zip \
                     release-assets/InputBridge-macOS-${{ github.ref_name }}.zip

                  # Ubuntu tar.gz
                  cp artifacts/InputBridge-Ubuntu/InputBridge-Ubuntu.tar.gz \
                     release-assets/InputBridge-Ubuntu-${{ github.ref_name }}.tar.gz

                  # AppImage
                  cp artifacts/InputBridge-Ubuntu-AppImage/InputBridge-Ubuntu.AppImage \
                     release-assets/InputBridge-Ubuntu-${{ github.ref_name }}.AppImage

                  # Flatpak
                  cp artifacts/InputBridge-Ubuntu-Flatpak/InputBridge-Ubuntu.flatpak \
                     release-assets/InputBridge-Ubuntu-${{ github.ref_name }}.flatpak

                  # Fedora tar.gz
                  cp artifacts/InputBridge-Fedora/InputBridge-Fedora.tar.gz \
                     release-assets/InputBridge-Fedora-${{ github.ref_name }}.tar.gz

                  # Arch tar.gz
                  cp artifacts/InputBridge-Arch/InputBridge-Arch.tar.gz \
                     release-assets/InputBridge-Arch-${{ github.ref_name }}.tar.gz

                  echo "Release assets:"
                  ls -lh release-assets/

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  name: InputBridge ${{ github.ref_name }}
                  # Mark as pre-release automatically for tags containing
                  # "-alpha", "-beta", or "-rc".
                  prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
                  generate_release_notes: true
                  files: release-assets/*