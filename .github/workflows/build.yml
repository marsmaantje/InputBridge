name: Build and Package

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Package
      run: |
        cd build
        cpack -C Release -G ZIP
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: InputBridge-Windows
        path: build/*.zip

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Package
      run: |
        cd build
        cpack -C Release -G ZIP

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: InputBridge-macOS
        path: build/*.zip

  build-linux-appimage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build libgl1-mesa-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev libwayland-dev libxkbcommon-dev

    - name: Configure and Build
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
        DESTDIR=AppDir cmake --build build --target install

    - name: Create AppImage
      run: |
        wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage
        ./linuxdeploy-x86_64.AppImage --appdir build/AppDir --output appimage --icon-file build/org.inputbridge.InputBridge.svg --desktop-file build/org.inputbridge.InputBridge.desktop

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: InputBridge-AppImage
        path: InputBridge*.AppImage

  build-linux-flatpak:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Flatpak
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak install --user -y org.freedesktop.Sdk//23.08 org.freedesktop.Platform//23.08

    - name: Build Flatpak
      run: |
        flatpak-builder --user --disable-rofiles-fuse --force-clean build-dir org.inputbridge.InputBridge.yml
        flatpak build-bundle repo InputBridge.flatpak org.inputbridge.InputBridge

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: InputBridge-Flatpak
        path: InputBridge.flatpak