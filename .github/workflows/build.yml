name: Build and Package

on:
    workflow_dispatch:
        inputs:
            build_target:
                description: "Select build target"
                required: true
                type: choice
                default: "all"
                options:
                    - all
                    - windows
                    - macos
                    - ubuntu
                    - ubuntu-appimage
                    - ubuntu-flatpak
                    - fedora
                    - arch

jobs:
    build-windows:
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'windows' }}
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Configure CMake
              run: cmake -B build -DCMAKE_BUILD_TYPE=Release

            - name: Build
              run: cmake --build build --config Release

            - name: Package
              run: |
                  cmake --install build --config Release --prefix package

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: InputBridge-Windows
                  path: package/bin

    build-macos:
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'macos' }}
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Configure CMake
              run: cmake -B build -DCMAKE_BUILD_TYPE=Release

            - name: Build
              run: cmake --build build --config Release

            - name: Package
              run: |
                  cd build
                  cpack -C Release -G ZIP

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: InputBridge-macOS
                  path: build/*.zip

    build-ubuntu-appimage:
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'ubuntu-appimage' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Install Dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libsamplerate0-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev libxtst-dev

            - name: Configure and Build
              run: |
                  cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DSDL_SHARED=OFF -DSDL_STATIC=ON
                  DESTDIR=AppDir cmake --build build --target install

            - name: Create AppImage
              run: |
                  wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
                  chmod +x linuxdeploy-x86_64.AppImage
                  # Set STRIP to /bin/true to avoid strip failures on newer binaries
                  APPIMAGE_EXTRACT_AND_RUN=1 STRIP=/bin/true ./linuxdeploy-x86_64.AppImage --appdir build/AppDir --output appimage \
                    --icon-file build/org.inputbridge.InputBridge.svg \
                    --desktop-file build/org.inputbridge.InputBridge.desktop
                  mv InputBridge*.AppImage InputBridge-Ubuntu.AppImage

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: InputBridge-Ubuntu-AppImage
                  path: InputBridge-Ubuntu.AppImage

    build-ubuntu-flatpak:
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'ubuntu-flatpak' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Install Flatpak
              run: |
                  sudo apt-get update
                  sudo apt-get install -y flatpak flatpak-builder
                  flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
                  flatpak install --user -y org.freedesktop.Sdk//23.08 org.freedesktop.Platform//23.08

            - name: Build Flatpak
              run: |
                  flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --repo=repo --force-clean build-dir org.inputbridge.InputBridge.yml
                  flatpak build-bundle repo InputBridge-Ubuntu.flatpak org.inputbridge.InputBridge

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: InputBridge-Ubuntu-Flatpak
                  path: InputBridge-Ubuntu.flatpak

    build-ubuntu:
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'ubuntu' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Install Dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential git cmake libx11-dev libxrandr-dev libxcursor-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev libpulse-dev libxss-dev libxext-dev libxfixes-dev libxinerama-dev libxxf86vm-dev libdbus-1-dev libdrm-dev libgbm-dev libusb-1.0-0-dev libsamplerate0-dev libdecor-0-dev libxtst-dev libssl-dev zlib1g-dev libuv1-dev

            - name: Configure CMake
              run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON

            - name: Build
              run: cmake --build build --config Release

            - name: Package
              run: |
                  cmake --install build --config Release --prefix package
                  mkdir -p dist
                  tar -czvf dist/InputBridge-Ubuntu.tar.gz -C package .

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: InputBridge-Ubuntu
                  path: dist/InputBridge-Ubuntu.tar.gz

    build-fedora:
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'fedora' }}
        runs-on: ubuntu-latest
        container: fedora:latest
        steps:
            - name: Install Dependencies
              run: dnf install -y git gcc-c++ make cmake libX11-devel libXrandr-devel libXcursor-devel libXi-devel mesa-libGL-devel libxkbcommon-devel wayland-devel systemd-devel alsa-lib-devel pulseaudio-libs-devel libXScrnSaver-devel libXext-devel libXfixes-devel libXinerama-devel libXxf86vm-devel dbus-devel libdrm-devel mesa-libgbm-devel libusb1-devel libsamplerate-devel libdecor-devel libXtst-devel openssl-devel zlib-devel libuv-devel

            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Configure CMake
              run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON

            - name: Build
              run: cmake --build build --config Release

            - name: Package
              run: |
                  cmake --install build --config Release --prefix package
                  mkdir -p dist
                  tar -czvf dist/InputBridge-Fedora.tar.gz -C package .

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: InputBridge-Fedora
                  path: dist/InputBridge-Fedora.tar.gz

    build-arch:
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'arch' }}
        runs-on: ubuntu-latest
        container: archlinux:latest
        steps:
            - name: Install Dependencies
              run: pacman -Syu --noconfirm git base-devel cmake libx11 libxrandr libxcursor libxi mesa libxkbcommon wayland systemd-libs alsa-lib pulseaudio libxss libxext libxfixes libxinerama libxxf86vm dbus libdrm libusb libsamplerate libdecor libxtst openssl zlib libuv

            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Configure CMake
              run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON

            - name: Build
              run: cmake --build build --config Release

            - name: Package
              run: |
                  cmake --install build --config Release --prefix package
                  mkdir -p dist
                  tar -czvf dist/InputBridge-Arch.tar.gz -C package .

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: InputBridge-Arch
                  path: dist/InputBridge-Arch.tar.gz
