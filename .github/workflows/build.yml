name: Build and Package

on:
    push:
        tags:
            - "v*"   # fires on v1.0.0, v1.2.3-beta, etc.

    workflow_dispatch:
        inputs:
            build_target:
                description: "Select build target"
                required: true
                type: choice
                default: "all"
                options:
                    - all
                    - windows
                    - macos
                    - ubuntu
                    - appimage
                    - flatpak
                    - fedora
                    - arch
            run_tests:
                description: "Run Google Tests"
                required: true
                type: choice
                default: "no"
                options:
                    - "no"
                    - "yes"
                    - "only"
            smoke_test:
                description: "Run smoke test (launch check) on each platform"
                required: false
                type: choice
                default: "no"
                options:
                    - "no"
                    - "yes"

permissions:
  checks: write    # for dorny/test-reporter to publish test reports
  contents: write  # for actions/checkout to fetch code, and to create GitHub Releases

concurrency:
  # Group by ref so pushing a new tag / re-dispatching cancels a
  # stale in-flight run for the same ref instead of running both to
  # completion. Tag pushes (releases) are never cancelled once
  # started - only workflow_dispatch runs on the same branch are.
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
    build-windows:
        if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'windows') && github.event.inputs.run_tests != 'only' }}
        runs-on: windows-2025
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: false

            - uses: ./.github/actions/restore-submodules

            - name: Set up MSVC developer environment
              # Needed because we build with Ninja instead of the default VS
              # generator below - Ninja doesn't know where cl.exe/link.exe
              # live, and only the VS generator (which ccache can't hook
              # into) sets that up automatically.
              uses: ilammy/msvc-dev-cmd@v1

            - name: Set up ccache
              uses: hendrikmuhs/ccache-action@v1.2.22
              with:
                  key: windows-release
                  variant: ccache

            - name: Configure CMake
              # -G Ninja: the default multi-config VS generator ignores
              # CMAKE_<LANG>_COMPILER_LAUNCHER, so ccache would silently
              # never be invoked. Ninja is single-config and does honor it.
              run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

            - name: Build
              run: cmake --build build

            - name: Package
              run: |
                  cmake --install build --prefix package
                  copy "C:/Program Files/OpenSSL/bin/libcrypto-3-x64.dll" package/bin
                  copy "C:/Program Files/OpenSSL/bin/libssl-3-x64.dll" package/bin
                  cmake -E make_directory package/bin/licenses
                  if (Test-Path "C:/Program Files/OpenSSL/license.txt") { copy "C:/Program Files/OpenSSL/license.txt" package/bin/licenses/OPENSSL_LICENSE.txt }

            - name: Smoke test (launch check)
              if: ${{ github.event.inputs.smoke_test == 'yes' }}
              shell: pwsh
              run: |
                  $bin = "package\bin\InputBridge.exe"
                  if (-not (Test-Path $bin)) { Write-Error "Binary not found: $bin"; exit 1 }
                  Write-Host "Launching $bin"
                  $proc = Start-Process -FilePath $bin -PassThru
                  Start-Sleep -Seconds 5
                  if ($proc.HasExited -and $proc.ExitCode -notin @(0)) {
                      Write-Error "Smoke test FAILED - process exited with code $($proc.ExitCode)"
                      exit 1
                  }
                  if (-not $proc.HasExited) { $proc.Kill() }
                  Write-Host "Smoke test passed."

            - name: Upload Artifact
              uses: actions/upload-artifact@v6
              with:
                  name: InputBridge-Windows
                  path: package/bin

    build-macos:
        if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'macos') && github.event.inputs.run_tests != 'only' }}
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: false

            - uses: ./.github/actions/restore-submodules

            - name: Set up ccache
              uses: hendrikmuhs/ccache-action@v1.2.22
              with:
                  key: macos-release

            - name: Configure CMake
              run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

            - name: Build
              # No -G Ninja here (default generator is Makefiles), and
              # `make` doesn't parallelize on its own - pass --parallel
              # explicitly or this silently builds single-threaded.
              run: cmake --build build --config Release --parallel "$(sysctl -n hw.ncpu)"

            - name: Package
              run: |
                  cd build
                  cpack -C Release -G ZIP

            - name: Smoke test (launch check)
              if: ${{ github.event.inputs.smoke_test == 'yes' }}
              run: |
                  APP_BIN=$(find build -name "InputBridge" -perm +111 -not -name "*.dylib" | head -1)
                  echo "Binary: $APP_BIN"
                  test -f "$APP_BIN" || { echo "Binary not found"; exit 1; }

                  # Launch in the background, wait 5 s, then check whether it
                  # crashed before we had a chance to kill it.  We avoid any
                  # external timeout command (not reliably available on macOS).
                  "$APP_BIN" &
                  APP_PID=$!
                  sleep 5

                  if kill -0 "$APP_PID" 2>/dev/null; then
                      # Process is still alive after 5 s - that's a pass.
                      kill "$APP_PID"
                      wait "$APP_PID" 2>/dev/null || true
                      echo "Smoke test passed (exit $CODE)."
                  else
                      # Process exited on its own; retrieve its exit code.
                      wait "$APP_PID"
                      CODE=$?
                      if [ "$CODE" -le 1 ]; then
                          echo "Smoke test passed (exit $CODE)."
                      else
                          echo "Smoke test FAILED - binary crashed with exit code $CODE."
                          exit 1
                      fi
                  fi

            - name: Upload Artifact
              uses: actions/upload-artifact@v6
              with:
                  name: InputBridge-macOS
                  path: build/*.zip

    build-appimage:
      if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'appimage') && github.event.inputs.run_tests != 'only' }}
      runs-on: ubuntu-24.04

      steps:
          - uses: actions/checkout@v6
            with:
                submodules: false

          - uses: ./.github/actions/restore-submodules

          - name: Prepare apt cache directory
            run: |
                sudo mkdir -p /var/cache/apt/archives/partial
                sudo chmod -R 777 /var/cache/apt/archives

          - name: Cache apt packages
            uses: actions/cache@v5
            with:
              path: |
                /var/cache/apt/archives
              key: ${{ runner.os }}-apt-cache-${{ hashFiles('.github/workflows/build.yml') }}
              restore-keys: |
                ${{ runner.os }}-apt-cache-

          - name: Install Dependencies
            run: |
                sudo apt-get update
                sudo apt-get install -y \
                  build-essential git pkg-config cmake ninja-build \
                  libasound2-dev libpulse-dev libaudio-dev libjack-dev \
                  libsndio-dev libsamplerate0-dev libx11-dev libxext-dev \
                  libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
                  libxss-dev libxkbcommon-dev libxinerama-dev \
                  libxxf86vm-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
                  libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
                  libibus-1.0-dev libudev-dev fcitx-libs-dev \
                  libpipewire-0.3-dev libwayland-dev libdecor-0-dev \
                  libxtst-dev libssl-dev zlib1g-dev libuv1-dev \
                  libusb-1.0-0-dev

          - name: Fix apt cache permissions
            # apt-get install runs via sudo (root), so newly downloaded
            # .deb files (and some dpkg temp files under partial/) land
            # back owned by root. chmod alone wasn't enough - tar (run by
            # the non-root runner user during the cache-save step) still
            # failed on a handful of entries - so hand ownership over
            # entirely instead of just poking at permission bits.
            run: sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

          - name: Set up ccache
            uses: hendrikmuhs/ccache-action@v1.2.22
            with:
                key: appimage-release

          - name: Configure
            run: |
                cmake -B build \
                  -G Ninja \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_INSTALL_PREFIX=/usr \
                  -DSDL_SHARED=OFF \
                  -DSDL_STATIC=ON \
                  -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                  -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          - name: Build
            run: cmake --build build

          - name: Install into AppDir
            run: |
                rm -rf build/AppDir
                mkdir -p build/AppDir

                DESTDIR=$PWD/build/AppDir cmake --install build

          - name: Verify AppDir Contents
            run: |
                find build/AppDir

                test -f build/AppDir/usr/bin/InputBridge

                # LinuxUdevInstaller::ResolveScriptPath() needs these one
                # directory up from the binary (usr/bin/../share/...) -
                # verify cmake --install actually put them there, since
                # nothing else in this job would otherwise catch it if a
                # future change silently dropped them (see the equivalent
                # check added to build-ubuntu's tarball for the class of
                # bug this guards against).
                test -f build/AppDir/usr/share/inputbridge/udev/install-udev-rules.sh || { echo "install-udev-rules.sh missing from AppDir"; exit 1; }
                test -f build/AppDir/usr/share/inputbridge/udev/71-inputbridge-wiimote.rules || { echo "71-inputbridge-wiimote.rules missing from AppDir"; exit 1; }

          - name: Cache linuxdeploy tool
            id: cache-linuxdeploy
            uses: actions/cache@v5
            with:
                path: linuxdeploy-x86_64.AppImage
                # "continuous" is a rolling tag, not a pinned version, so
                # this cache is intentionally short-lived: it only saves
                # the redundant download when this job runs multiple
                # times in quick succession (e.g. re-running a release).
                key: linuxdeploy-continuous-${{ github.run_id }}
                restore-keys: |
                  linuxdeploy-continuous-

          - name: Create AppImage
            run: |
                if [ ! -f linuxdeploy-x86_64.AppImage ]; then
                  wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
                fi

                chmod +x linuxdeploy-x86_64.AppImage

                export LD_LIBRARY_PATH=$PWD/build/AppDir/usr/lib:$LD_LIBRARY_PATH

                APPIMAGE_EXTRACT_AND_RUN=1 \
                STRIP=/bin/true \
                ./linuxdeploy-x86_64.AppImage \
                  --appdir build/AppDir \
                  --executable build/AppDir/usr/bin/InputBridge \
                  --icon-file build/org.inputbridge.InputBridge.svg \
                  --desktop-file build/org.inputbridge.InputBridge.desktop \
                  --output appimage

                mv InputBridge*.AppImage InputBridge.AppImage

          - name: Verify udev assets survived AppImage bundling
            run: |
                chmod +x InputBridge.AppImage
                ./InputBridge.AppImage --appimage-extract >/dev/null
                test -f squashfs-root/usr/share/inputbridge/udev/install-udev-rules.sh || { echo "install-udev-rules.sh missing from the built AppImage - linuxdeploy dropped it"; exit 1; }
                test -f squashfs-root/usr/share/inputbridge/udev/71-inputbridge-wiimote.rules || { echo "71-inputbridge-wiimote.rules missing from the built AppImage - linuxdeploy dropped it"; exit 1; }
                rm -rf squashfs-root

          - name: Smoke test (launch check)
            if: ${{ github.event.inputs.smoke_test == 'yes' }}
            run: |
                chmod +x InputBridge.AppImage
                set +e
                APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run --auto-servernum timeout 5s ./InputBridge.AppImage
                CODE=$?
                set -e
                echo "Exit code: $CODE"
                # 124 = timeout (still running) - pass.
                # 0/1 = clean or handled exit - pass.
                # >128 = 128+signal (SIGABRT=134, SIGSEGV=139 etc.) - crash, fail.
                # Anything else (e.g. 127 missing lib) is a setup/env issue,
                # not a crash of the binary itself - fail with a clear message.
                if [ "$CODE" -eq 124 ] || [ "$CODE" -le 1 ]; then
                    echo "Smoke test passed (exit $CODE)."
                elif [ "$CODE" -gt 128 ]; then
                    echo "Smoke test FAILED - binary killed by signal $((CODE - 128))."
                    exit 1
                else
                    echo "Smoke test FAILED - unexpected exit code $CODE."
                    exit 1
                fi

          - name: Upload Artifact
            uses: actions/upload-artifact@v6
            with:
                name: InputBridge-AppImage
                path: InputBridge.AppImage

    build-flatpak:
        if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'flatpak') && github.event.inputs.run_tests != 'only' }}
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: false

            - uses: ./.github/actions/restore-submodules

            - name: Cache Flatpak SDK/Platform runtimes
              uses: actions/cache@v5
              with:
                  path: ~/.local/share/flatpak
                  # Keyed on the exact runtime versions pinned below, so a
                  # future SDK bump automatically invalidates this cache
                  # instead of silently reusing a stale/mismatched runtime.
                  key: flatpak-runtimes-25.08-${{ runner.os }}

            - name: Install Flatpak
              run: |
                  sudo apt-get update
                  sudo apt-get install -y flatpak flatpak-builder
                  flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
                  flatpak install --user -y org.freedesktop.Sdk//25.08 org.freedesktop.Platform//25.08

            - name: Build Flatpak
              run: |
                  flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --repo=repo --force-clean build-dir org.inputbridge.InputBridge.yml
                  flatpak build-bundle repo InputBridge.flatpak org.inputbridge.InputBridge

            - name: Smoke test (launch check)
              if: ${{ github.event.inputs.smoke_test == 'yes' }}
              run: |
                  flatpak install --user -y InputBridge.flatpak
                  set +e
                  timeout 5s flatpak run org.inputbridge.InputBridge
                  CODE=$?
                  set -e
                  echo "Exit code: $CODE"
                  # 124 = timeout (still running after 5 s) - pass.
                  # 0/1 = clean or gracefully handled exit - pass.
                  # >128 = 128+signal (SIGABRT=134, SIGSEGV=139 etc.) - crash, fail.
                  # 127 = missing shared library or command not found - env/packaging
                  #       issue, not a binary crash; fail with a clear message.
                  if [ "$CODE" -eq 124 ] || [ "$CODE" -le 1 ]; then
                      echo "Smoke test passed (exit $CODE)."
                  elif [ "$CODE" -gt 128 ]; then
                      echo "Smoke test FAILED - binary killed by signal $((CODE - 128))."
                      exit 1
                  else
                      echo "Smoke test FAILED - unexpected exit code $CODE (missing library or env issue?)."
                      exit 1
                  fi

            - name: Upload Artifact
              uses: actions/upload-artifact@v6
              with:
                  name: InputBridge-Flatpak
                  path: InputBridge.flatpak

    build-ubuntu:
        if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'ubuntu') && github.event.inputs.run_tests != 'only' }}
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: false

            - uses: ./.github/actions/restore-submodules

            - name: Prepare apt cache directory
              run: |
                  sudo mkdir -p /var/cache/apt/archives/partial
                  sudo chmod -R 777 /var/cache/apt/archives

            - name: Cache apt packages
              uses: actions/cache@v5
              with:
                path: |
                  /var/cache/apt/archives
                key: ${{ runner.os }}-apt-cache-${{ hashFiles('.github/workflows/build.yml') }}
                restore-keys: |
                  ${{ runner.os }}-apt-cache-

            - name: Install Dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential git pkg-config cmake ninja-build libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libsamplerate0-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libxinerama-dev libxxf86vm-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev libxtst-dev libssl-dev zlib1g-dev libuv1-dev libusb-1.0-0-dev xvfb

            - name: Fix apt cache permissions
              # apt-get install runs via sudo (root), so newly downloaded
              # .deb files (and some dpkg temp files under partial/) land
              # back owned by root. chmod alone wasn't enough - tar (run by
              # the non-root runner user during the cache-save step) still
              # failed on a handful of entries - so hand ownership over
              # entirely instead of just poking at permission bits.
              run: sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

            - name: Set up ccache
              uses: hendrikmuhs/ccache-action@v1.2.22
              with:
                  key: ubuntu-release

            - name: Configure CMake
              run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

            - name: Build
              run: cmake --build build --config Release

            - uses: ./.github/actions/package-linux-tarball
              with:
                  distro_name: Ubuntu
                  run_smoke_test: ${{ github.event.inputs.smoke_test }}

    build-fedora:
        if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'fedora') && github.event.inputs.run_tests != 'only' }}
        runs-on: ubuntu-24.04
        container: fedora:latest
        steps:
            - name: Install Dependencies
              run: dnf install -y git gcc-c++ make cmake ccache libX11-devel libXrandr-devel libXcursor-devel libXi-devel mesa-libGL-devel libxkbcommon-devel wayland-devel systemd-devel alsa-lib-devel pulseaudio-libs-devel libXScrnSaver-devel libXext-devel libXfixes-devel libXinerama-devel libXxf86vm-devel dbus-devel libdrm-devel mesa-libgbm-devel libusb1-devel libsamplerate-devel libdecor-devel libXtst-devel openssl-devel zlib-devel libuv-devel xorg-x11-server-Xvfb

            - uses: actions/checkout@v6
              with: { submodules: false }

            - uses: ./.github/actions/restore-submodules

            - name: Cache ccache directory
              # hendrikmuhs/ccache-action assumes a normal apt/brew/choco
              # host, which doesn't apply inside this fedora:latest
              # container, so cache the ccache dir directly instead.
              uses: actions/cache@v5
              with:
                path: ~/.cache/ccache
                key: fedora-ccache-${{ github.run_id }}
                restore-keys: |
                  fedora-ccache-

            - name: Configure CMake
              run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

            - name: Build
              # No -G Ninja here (default generator is Makefiles), and
              # `make` doesn't parallelize on its own - pass --parallel
              # explicitly or this silently builds single-threaded.
              run: cmake --build build --config Release --parallel "$(nproc)"

            - uses: ./.github/actions/package-linux-tarball
              with:
                  distro_name: Fedora
                  run_smoke_test: ${{ github.event.inputs.smoke_test }}

    build-arch:
        if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'arch') && github.event.inputs.run_tests != 'only' }}
        runs-on: ubuntu-24.04
        container: archlinux:latest
        steps:
            - name: Install Dependencies
              run: pacman -Syu --noconfirm git base-devel cmake ccache libx11 libxrandr libxcursor libxi mesa libxkbcommon wayland systemd-libs alsa-lib pulseaudio libxss libxext libxfixes libxinerama libxxf86vm dbus libdrm libusb libsamplerate libdecor libxtst openssl zlib libuv xorg-server-xvfb

            - uses: actions/checkout@v6
              with: { submodules: false }

            - uses: ./.github/actions/restore-submodules

            - name: Cache ccache directory
              # hendrikmuhs/ccache-action assumes a normal apt/brew/choco
              # host, which doesn't apply inside this archlinux:latest
              # container, so cache the ccache dir directly instead.
              uses: actions/cache@v5
              with:
                path: ~/.cache/ccache
                key: arch-ccache-${{ github.run_id }}
                restore-keys: |
                  arch-ccache-

            - name: Configure CMake
              run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

            - name: Build
              # No -G Ninja here (default generator is Makefiles), and
              # `make` doesn't parallelize on its own - pass --parallel
              # explicitly or this silently builds single-threaded.
              run: cmake --build build --config Release --parallel "$(nproc)"

            - uses: ./.github/actions/package-linux-tarball
              with:
                  distro_name: Arch
                  run_smoke_test: ${{ github.event.inputs.smoke_test }}

    run-tests:
        if: ${{ github.event.inputs.run_tests == 'yes' || github.event.inputs.run_tests == 'only' }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6
              with: { submodules: false }

            - uses: ./.github/actions/restore-submodules

            - name: Prepare apt cache directory
              if: runner.os == 'Linux'
              run: |
                  sudo mkdir -p /var/cache/apt/archives/partial
                  sudo chmod -R 777 /var/cache/apt/archives

            - name: Cache apt packages
              if: runner.os == 'Linux'
              uses: actions/cache@v5
              with:
                path: |
                  /var/cache/apt/archives
                key: ${{ runner.os }}-apt-cache-${{ hashFiles('.github/workflows/build.yml') }}
                restore-keys: |
                  ${{ runner.os }}-apt-cache-

            - name: Install Dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential git pkg-config cmake ninja-build libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libsamplerate0-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libxinerama-dev libxxf86vm-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev libxtst-dev libssl-dev zlib1g-dev libuv1-dev libusb-1.0-0-dev lcov

            - name: Fix apt cache permissions
              if: runner.os == 'Linux'
              # apt-get install runs via sudo (root), so newly downloaded
              # .deb files (and some dpkg temp files under partial/) land
              # back owned by root. chmod alone isn't reliably enough -
              # tar (run by the non-root runner user during the
              # cache-save step) can still fail on a handful of entries -
              # so hand ownership over entirely instead of just poking at
              # permission bits.
              run: sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

            - name: Add OpenSSL to PATH (Windows)
              if: runner.os == 'Windows'
              run: echo "C:/Program Files/OpenSSL/bin" >> $env:GITHUB_PATH

            - name: Set up ccache
              uses: hendrikmuhs/ccache-action@v1.2.22
              with:
                  key: tests-${{ matrix.os }}

            - name: Configure CMake
              shell: bash
              run: |
                declare -a CMAKE_ARGS=("-B" "build" "-G" "Ninja" "-DBUILD_TESTS=ON" "-DCMAKE_BUILD_TYPE=Debug" "-DCMAKE_C_COMPILER_LAUNCHER=ccache" "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache")
                if [[ "${{ runner.os }}" == "Linux" ]]; then
                  CMAKE_ARGS+=("-DCMAKE_CXX_FLAGS=--coverage" "-DCMAKE_C_FLAGS=--coverage")
                fi
                cmake "${CMAKE_ARGS[@]}"

            - name: Build
              run: cmake --build build

            - name: Run Tests
              working-directory: ./build
              run: ctest --output-on-failure --output-junit test-results.xml

            - name: Upload Test Results
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: test-results-${{ matrix.os }}
                  path: build/test-results.xml

            - name: Publish Test Report
              uses: dorny/test-reporter@v3
              if: always()
              with:
                name: Test Results (${{ matrix.os }})
                path: build/test-results.xml
                reporter: java-junit

            - name: Generate Coverage Report
              if: runner.os == 'Linux'
              run: |
                  lcov --capture --ignore-errors mismatch --rc geninfo_unexecuted_blocks=1 --directory build --output-file coverage.info
                  lcov --remove coverage.info '/usr/*' '*/tests/*' '*/lib/*' --output-file coverage.info
                  genhtml coverage.info --output-directory coverage-report

            - name: Upload Coverage Report
              if: runner.os == 'Linux'
              uses: actions/upload-artifact@v6
              with:
                  name: coverage-report
                  path: coverage-report
    create-release:
        name: Create GitHub Release
        # Only run on tag pushes, not manual dispatches.
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        needs:
            - build-windows
            - build-macos
            - build-ubuntu
            - build-appimage
            - build-flatpak
            - build-fedora
            - build-arch
        runs-on: ubuntu-24.04
        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v6
              with:
                  path: artifacts

            # Flatten each artifact folder into a single zip for the release.
            - name: Repackage artifacts
              run: |
                  mkdir release-assets

                  # Windows - folder of files → zip
                  cd artifacts/InputBridge-Windows
                  zip -r ../../release-assets/InputBridge-Windows-${{ github.ref_name }}.zip .
                  cd ../..

                  # macOS - already a zip from cpack
                  cp artifacts/InputBridge-macOS/*.zip \
                     release-assets/InputBridge-macOS-${{ github.ref_name }}.zip

                  # Ubuntu tar.gz
                  cp artifacts/InputBridge-Ubuntu/InputBridge-Ubuntu.tar.gz \
                     release-assets/InputBridge-Ubuntu-${{ github.ref_name }}.tar.gz

                  # AppImage
                  cp artifacts/InputBridge-AppImage/InputBridge.AppImage \
                     release-assets/InputBridge-${{ github.ref_name }}.AppImage

                  # Flatpak
                  cp artifacts/InputBridge-Flatpak/InputBridge.flatpak \
                     release-assets/InputBridge-${{ github.ref_name }}.flatpak

                  # Fedora tar.gz
                  cp artifacts/InputBridge-Fedora/InputBridge-Fedora.tar.gz \
                     release-assets/InputBridge-Fedora-${{ github.ref_name }}.tar.gz

                  # Arch tar.gz
                  cp artifacts/InputBridge-Arch/InputBridge-Arch.tar.gz \
                     release-assets/InputBridge-Arch-${{ github.ref_name }}.tar.gz

                  echo "Release assets:"
                  ls -lh release-assets/

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  name: InputBridge ${{ github.ref_name }}
                  # Mark as pre-release automatically for tags containing
                  # "-alpha", "-beta", or "-rc".
                  prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
                  generate_release_notes: true
                  files: release-assets/*